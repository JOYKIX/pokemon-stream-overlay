<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeOverlay Studio V2 - Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body class="app-page">
  <a class="site-header-anchor" href="index.html" aria-label="PokeOverlay home">PokeOverlay</a>

  <div class="dashboard-shell">
    <aside class="sidebar">
      <div><p class="sidebar-kicker" data-i18n="pokemon_stream_overlay_for_obs"></p><h1 class="sidebar-title" data-i18n="design"></h1></div>
      <nav class="sidebar-nav">
        <p class="nav-group-label" data-i18n="general"></p>
        <a class="nav-item" href="index.html"><span class="material-symbols-rounded">dashboard</span><span data-i18n="studio"></span></a>
        <a class="nav-item active" href="customize.html"><span class="material-symbols-rounded">palette</span><span data-i18n="design"></span></a>
        <a class="nav-item" href="share.html"><span class="material-symbols-rounded">share</span><span data-i18n="share"></span></a>
        <p class="nav-group-label" data-i18n="account"></p>
        <a class="nav-item" href="options.html"><span class="material-symbols-rounded">person</span><span data-i18n="profile"></span></a>
        <button id="logoutBtn" class="nav-item nav-btn" type="button"><span class="material-symbols-rounded">logout</span><span data-i18n="logout"></span></button>
      </nav>
    </aside>
    <main class="dashboard-main">
      <header class="topbar"><h2 class="page-title">Layout Forge</h2><div class="topbar-controls"><label class="switch-chip" for="languageSelect"><span data-i18n="ui_language"></span><select id="languageSelect"><option value="en" data-i18n="english"></option><option value="fr" data-i18n="french"></option><option value="es" data-i18n="spanish"></option><option value="ja" data-i18n="japanese"></option></select></label></div></header>
      <section class="studio-grid design-grid">
        <section class="card layout-editor-card">
          <div class="field"><label for="channelInput">Channel ID</label><input id="channelInput" type="text" readonly></div>
          <div class="section-header"><h3>Card Position Matrix</h3></div>
          <p class="layout-editor-help">Adjust each anchor point to refine the visual rhythm and readability of your Pokémon cards.</p>
          <label class="switch-chip layout-magnet-toggle" for="snapToGridToggle"><span>Snap to Grid</span><input id="snapToGridToggle" type="checkbox" checked><span class="toggle-slider" aria-hidden="true"></span></label>
          <div id="layoutCanvas" class="layout-canvas" aria-label="Canvas de placement"></div>
          <div class="actions">
            <button id="resetLayoutBtn" class="secondary-btn" type="button">Reset</button>
            <button id="loadBtn" class="secondary-btn" type="button">Load</button>
            <button id="saveBtn" class="primary-btn" type="button">Save</button>
          </div>
          <div id="statusBox" class="status-box info">Ready</div>
        </section>
        <section class="card">
          <div class="section-header"><h3>Live Card Preview</h3></div>
          <div id="layoutPreview" class="layout-live-preview">
            <article class="overlay-card preview-card">
              <div class="overlay-card-top"><div class="overlay-level">Lv.25</div></div>
              <div class="overlay-image-wrap">
                <img class="overlay-pokeball" src="./pokeball.png" alt="" aria-hidden="true">
                <img class="preview-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu">
              </div>
              <div class="overlay-name-wrap"><div class="overlay-name-panel"><div class="overlay-name">Sparky</div><div class="overlay-species">Pikachu</div></div></div>
              <div class="overlay-meta"><span class="meta-pill item">Life Orb</span></div>
              <div class="overlay-types"><img class="type-logo" src="./logo_type/type_electrik.png" alt="Electric"></div>
            </article>
          </div>
        </section>
      </section>
    </main>
  </div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <script type="module" src="dist/spa.js"></script>
</body>
</html>
