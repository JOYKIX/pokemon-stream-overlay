<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon Stream Overlay Studio - Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page studio-page">
  <div class="dashboard-shell">
    <aside class="sidebar" aria-label="Main Navigation">
      <div>
        <p class="sidebar-kicker">Pokemon Stream Overlay</p>
        <h1 class="sidebar-title">Studio</h1>
      </div>
      <nav class="sidebar-nav">
        <p class="nav-group-label">GENERAL</p>
        <a class="nav-item active" href="index.html"><span class="material-symbols-rounded">dashboard</span>Studio</a>
        <a class="nav-item" href="customize.html"><span class="material-symbols-rounded">palette</span>Design</a>
        <p class="nav-group-label">ACCOUNT</p>
        <a class="nav-item" href="options.html"><span class="material-symbols-rounded">person</span>Profile</a>
        <button id="logoutBtn" class="nav-item nav-btn" type="button"><span class="material-symbols-rounded">logout</span>Logout</button>
      </nav>
    </aside>

    <main class="dashboard-main">
      <header class="topbar">
        <h2 class="page-title">Studio</h2>
        <div class="topbar-controls">
          <label class="switch-chip" for="snapToGrid"><span>Drag</span><input id="snapToGrid" type="checkbox" checked><span class="toggle-slider" aria-hidden="true"></span></label>
          <label class="switch-chip" for="transitionToggle"><span>Transition</span><input id="transitionToggle" type="checkbox" checked><span class="toggle-slider" aria-hidden="true"></span></label>
          <button id="exportObsBtn" class="primary-btn" type="button">OBS export</button>
        </div>
      </header>

      <div class="autosave-bar">Autosave: <strong id="autosaveIndicator">Idle</strong></div>

      <section class="studio-grid">
        <section class="card left-column">
          <div class="segment-control" role="tablist" aria-label="Panneau gauche">
            <button class="segment-btn active" type="button" data-left-view-btn="stream" aria-selected="true">Stream settings</button>
            <button class="segment-btn" type="button" data-left-view-btn="sprite" aria-selected="false">Stream display</button>
          </div>

          <div class="segment-panel active" data-left-panel="stream">
            <div class="section-header"><h3>STREAM SETTINGS</h3></div>
            <div class="field"><label for="channelInput">Channel ID</label><input id="channelInput" type="text" readonly /></div>
            <div class="field"><label for="trainerInput">Trainer name</label><input id="trainerInput" type="text" /></div>
            <div class="field"><label for="badgeInput">Team label</label><input id="badgeInput" type="text" /></div>
            <div class="inline-fields">
              <div class="field"><label for="streamWidth">Resolution width</label><input id="streamWidth" type="number" value="1920" /></div>
              <div class="field"><label for="streamHeight">Resolution height</label><input id="streamHeight" type="number" value="1080" /></div>
            </div>
            <div class="field"><label for="resolutionPreset">Preset</label><select id="resolutionPreset"><option value="custom">Custom</option><option value="1920x1080">1920x1080</option><option value="2560x1440">2560x1440</option><option value="1280x720">1280x720</option></select></div>

            <div class="section-header"><h3>RUN MODE</h3></div>
            <label class="switch-chip" for="nuzlockeMode"><span>Nuzlocke mode</span><input type="checkbox" id="nuzlockeMode"><span class="toggle-slider" aria-hidden="true"></span></label>
            <div class="field" id="deathCountField"><label for="deathCountInput">Death counter</label><input id="deathCountInput" type="number" min="0" value="0"></div>
            <label class="switch-chip" for="autoSave"><span>Auto save</span><input type="checkbox" id="autoSave" checked><span class="toggle-slider" aria-hidden="true"></span></label>

            <div class="section-header"><h3>OBS INTEGRATION</h3></div>
            <div class="field"><label for="overlayUrl">Overlay URL</label><input id="overlayUrl" type="text" readonly /></div>
            <div class="actions">
              <button id="copyUrlBtn" class="secondary-btn" type="button">Copy browser source</button>
              <a id="openOverlayBtn" class="secondary-btn link-btn" target="_blank">Open overlay</a>
              <button id="testOverlayBtn" class="secondary-btn" type="button">Test overlay</button>
            </div>
          </div>

          <div class="segment-panel" data-left-panel="sprite">
            <div class="section-header"><h3>SPRITE DISPLAY</h3></div>
            <div class="toggle-grid">
              <label class="switch-chip" for="showHeader"><span>Header</span><input type="checkbox" id="showHeader" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showName"><span>Name</span><input type="checkbox" id="showName" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showNickname"><span>Nickname</span><input type="checkbox" id="showNickname" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showLevel"><span>Level</span><input type="checkbox" id="showLevel" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showItem"><span>Item</span><input type="checkbox" id="showItem" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showTypes"><span>Types</span><input type="checkbox" id="showTypes" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showShiny"><span>Visibility</span><input type="checkbox" id="showShiny" checked><span class="toggle-slider" aria-hidden="true"></span></label>
            </div>

            <div class="section-header"><h3>SPRITE STYLE</h3></div>
            <div class="field"><label for="spriteVariant">Sprite style</label><select id="spriteVariant"><option value="auto">Auto</option><option value="official-artwork">Official</option><option value="home">Home</option><option value="pixel">Pixel</option><option value="dream-world">Dream</option><option value="showdown">Showdown</option><option value="scarlet-violet">Scarlet/Violet</option></select></div>
            <div class="field"><label for="spriteScale">Sprite size <span id="spriteScaleValue">100%</span></label><input id="spriteScale" type="range" min="50" max="1000" value="100"></div>
            <label class="switch-chip" for="preferAnimatedSprite"><span>Animated toggle</span><input type="checkbox" id="preferAnimatedSprite"><span class="toggle-slider" aria-hidden="true"></span></label>
            <label class="switch-chip" for="spriteOnlyMode"><span>Remove background</span><input type="checkbox" id="spriteOnlyMode"><span class="toggle-slider" aria-hidden="true"></span></label>
          </div>
        </section>

        <section class="card right-column">
          <div class="segment-control" role="tablist" aria-label="Panneau droit">
            <button class="segment-btn active" type="button" data-team-view-btn="builder" aria-selected="true">Team builder</button>
            <button class="segment-btn" type="button" data-team-view-btn="canvas" aria-selected="false">Canvas</button>
          </div>

          <div class="segment-panel active" data-team-panel="builder">
            <div class="section-header"><h3>TEAM BUILDER</h3><p>Drag and drop to reorder slots.</p></div>
            <datalist id="pokemonSuggestions"></datalist>
            <div class="slots" id="teamSlots" aria-live="polite"></div>
          </div>

          <div class="segment-panel" data-team-panel="canvas">
            <div class="editor-canvas-wrap">
              <div class="editor-toolbar"><strong>Layout canvas</strong><button id="resetPositionsBtn" class="secondary-btn small" type="button">Reset positions</button></div>
              <div id="editorCanvas" class="editor-canvas"></div>
            </div>
          </div>

          <div class="section-header"><h3>DATA</h3></div>
          <div class="actions vertical">
            <button id="saveBtn" class="primary-btn" type="button">Save team</button>
            <button id="loadBtn" class="secondary-btn" type="button">Load team</button>
            <button id="clearBtn" class="danger-btn" type="button">Reset team</button>
          </div>
          <div id="statusBox" class="status-box info">Ready.</div>
        </section>
      </section>
    </main>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
