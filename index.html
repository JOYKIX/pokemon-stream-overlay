<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeOverlay Studio V2 - Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page studio-page">
  <a class="site-header-anchor" href="index.html" aria-label="PokeOverlay home">PokeOverlay</a>

  <div class="dashboard-shell">
    <aside class="sidebar" aria-label="Main Navigation">
      <div>
        <p class="sidebar-kicker" data-i18n="pokemon_stream_overlay_for_obs"></p>
        <h1 class="sidebar-title" data-i18n="studio"></h1>
      </div>
      <nav class="sidebar-nav">
        <p class="nav-group-label" data-i18n="general"></p>
        <a class="nav-item active" href="index.html"><span class="material-symbols-rounded">dashboard</span><span data-i18n="studio"></span></a>
        <a class="nav-item" href="customize.html"><span class="material-symbols-rounded">palette</span><span data-i18n="design"></span></a>
        <a class="nav-item" href="share.html"><span class="material-symbols-rounded">share</span><span data-i18n="share"></span></a>
        <p class="nav-group-label" data-i18n="account"></p>
        <a class="nav-item" href="options.html"><span class="material-symbols-rounded">person</span><span data-i18n="profile"></span></a>
        <button id="logoutBtn" class="nav-item nav-btn" type="button"><span class="material-symbols-rounded">logout</span><span data-i18n="logout"></span></button>
      </nav>
    </aside>

    <main class="dashboard-main">
      <header class="topbar">
        <h2 class="page-title" data-i18n="studio"></h2>
        <div class="topbar-controls">
          <label class="switch-chip" for="snapToGrid"><span data-i18n="drag"></span><input id="snapToGrid" type="checkbox" checked><span class="toggle-slider" aria-hidden="true"></span></label>
          <label class="switch-chip" for="transitionToggle"><span data-i18n="transition"></span><input id="transitionToggle" type="checkbox" checked><span class="toggle-slider" aria-hidden="true"></span></label>
          <label class="switch-chip" for="languageSelect"><span data-i18n="ui_language"></span><select id="languageSelect"><option value="en" data-i18n="english"></option><option value="fr" data-i18n="french"></option><option value="es" data-i18n="spanish"></option><option value="ja" data-i18n="japanese"></option></select></label>
          <button id="exportObsBtn" class="primary-btn" type="button" data-i18n="obs_export"></button>
        </div>
      </header>

      <div class="autosave-bar"><span data-i18n="autosave"></span>: <strong id="autosaveIndicator" data-i18n="idle"></strong></div>

      <section class="studio-grid">
        <section class="card left-column">
          <div class="segment-control" role="tablist" aria-label="Left panel">
            <button class="segment-btn active" type="button" data-left-view-btn="stream" aria-selected="true" data-i18n="stream_settings"></button>
            <button class="segment-btn" type="button" data-left-view-btn="sprite" aria-selected="false" data-i18n="sprite_display"></button>
          </div>

          <div class="segment-panel active" data-left-panel="stream">
            <div class="section-header"><h3 data-i18n="stream_settings"></h3></div>
            <div class="field"><label for="channelInput" data-i18n="channel_id"></label><input id="channelInput" type="text" readonly /></div>
            <div class="field"><label for="trainerInput" data-i18n="trainer_name"></label><input id="trainerInput" type="text" /></div>
            <div class="field"><label for="badgeInput" data-i18n="team_label"></label><input id="badgeInput" type="text" /></div>
            <div class="inline-fields">
              <div class="field"><label for="badgeGameSelect">Jeu badges</label><select id="badgeGameSelect"><option value="none">Aucun</option><option value="kanto">Kanto (1G)</option><option value="johto">Johto (2G)</option><option value="hoenn">Hoenn (3G)</option><option value="sinnoh">Sinnoh (4G)</option><option value="unys_bw">Unys BW (5G)</option><option value="unys_b2w2">Unys B2W2 (5G)</option></select></div>
              <div class="field"><label for="badgeCountInput">Badges obtenus</label><input id="badgeCountInput" type="number" min="0" max="8" value="0" /></div>
            </div>
            <label class="switch-chip" for="showBadges"><span>Afficher badges</span><input type="checkbox" id="showBadges"><span class="toggle-slider" aria-hidden="true"></span></label>
            <div class="inline-fields">
              <div class="field"><label for="streamWidth" data-i18n="resolution_width"></label><input id="streamWidth" type="number" value="1920" /></div>
              <div class="field"><label for="streamHeight" data-i18n="resolution_height"></label><input id="streamHeight" type="number" value="1080" /></div>
            </div>
            <div class="field"><label for="resolutionPreset" data-i18n="preset"></label><select id="resolutionPreset"><option value="custom" data-i18n="custom"></option><option value="1920x1080">1920x1080</option><option value="2560x1440">2560x1440</option><option value="1280x720">1280x720</option></select></div>

            <div class="section-header"><h3 data-i18n="run_mode"></h3></div>
            <label class="switch-chip" for="nuzlockeMode"><span data-i18n="nuzlocke_mode"></span><input type="checkbox" id="nuzlockeMode"><span class="toggle-slider" aria-hidden="true"></span></label>
            <label class="switch-chip" for="showNuzlockeLabel"><span data-i18n="show_nuzlocke_label"></span><input type="checkbox" id="showNuzlockeLabel" checked><span class="toggle-slider" aria-hidden="true"></span></label>
            <div class="field" id="deathCountField"><label for="deathCountInput" data-i18n="death_counter"></label><input id="deathCountInput" type="number" min="0" value="0"></div>
            <label class="switch-chip" for="autoSave"><span data-i18n="auto_save"></span><input type="checkbox" id="autoSave"><span class="toggle-slider" aria-hidden="true"></span></label>

            <div class="section-header"><h3 data-i18n="obs_integration"></h3></div>
            <div class="field"><label for="overlayUrl" data-i18n="overlay_url"></label><input id="overlayUrl" type="text" readonly /></div>
            <div class="actions">
              <button id="copyUrlBtn" class="secondary-btn" type="button" data-i18n="copy_browser_source"></button>
              <a id="openOverlayBtn" class="secondary-btn link-btn" target="_blank" data-i18n="open_overlay"></a>
              <button id="testOverlayBtn" class="secondary-btn" type="button" data-i18n="test_overlay"></button>
            </div>
          </div>

          <div class="segment-panel" data-left-panel="sprite">
            <div class="section-header"><h3 data-i18n="sprite_display"></h3></div>
            <div class="toggle-grid">
              <label class="switch-chip" for="showHeader"><span data-i18n="header"></span><input type="checkbox" id="showHeader" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showName"><span data-i18n="name"></span><input type="checkbox" id="showName" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showNickname"><span data-i18n="nickname"></span><input type="checkbox" id="showNickname" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showLevel"><span data-i18n="level"></span><input type="checkbox" id="showLevel" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showItem"><span data-i18n="item"></span><input type="checkbox" id="showItem" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showTypes"><span data-i18n="types"></span><input type="checkbox" id="showTypes" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showPokeball"><span data-i18n="pokeball"></span><input type="checkbox" id="showPokeball" checked><span class="toggle-slider" aria-hidden="true"></span></label>
              <label class="switch-chip" for="showShiny"><span data-i18n="visibility"></span><input type="checkbox" id="showShiny" checked><span class="toggle-slider" aria-hidden="true"></span></label>
            </div>

            <div class="section-header"><h3 data-i18n="sprite_style"></h3></div>
            <div class="field"><label for="spriteVariant" data-i18n="sprite_style"></label><select id="spriteVariant"><option value="auto" data-i18n="auto"></option><option value="official-artwork" data-i18n="official"></option><option value="home" data-i18n="home"></option><option value="pixel" data-i18n="pixel"></option><option value="dream-world" data-i18n="dream"></option><option value="showdown" data-i18n="showdown"></option><option value="scarlet-violet" data-i18n="scarlet_violet"></option></select></div>
            <div class="field"><label for="spriteScale"><span data-i18n="sprite_size"></span> <span id="spriteScaleValue">100%</span></label><input id="spriteScale" type="range" min="50" max="1000" value="100"></div>
            <div class="field"><label for="pokemonNameLanguage" data-i18n="pokemon_name_language"></label><select id="pokemonNameLanguage"><option value="auto" data-i18n="auto_ui_language"></option><option value="en" data-i18n="english"></option><option value="fr" data-i18n="french"></option><option value="es" data-i18n="spanish"></option><option value="ja" data-i18n="japanese"></option></select></div>
            <label class="switch-chip" for="preferAnimatedSprite"><span data-i18n="animated_toggle"></span><input type="checkbox" id="preferAnimatedSprite"><span class="toggle-slider" aria-hidden="true"></span></label>
            <label class="switch-chip" for="spriteOnlyMode"><span data-i18n="remove_background"></span><input type="checkbox" id="spriteOnlyMode"><span class="toggle-slider" aria-hidden="true"></span></label>
          </div>
        </section>

        <section class="card right-column">
          <div class="segment-control" role="tablist" aria-label="Right panel">
            <button class="segment-btn active" type="button" data-team-view-btn="builder" aria-selected="true" data-i18n="team_builder"></button>
            <button class="segment-btn" type="button" data-team-view-btn="canvas" aria-selected="false" data-i18n="canvas"></button>
          </div>

          <div class="segment-panel active" data-team-panel="builder">
            <div class="section-header"><h3 data-i18n="team_builder"></h3><p data-i18n="drag_and_drop_to_reorder_slots"></p></div>
            <datalist id="pokemonSuggestions"></datalist>
            <div class="slots" id="teamSlots" aria-live="polite"></div>
          </div>

          <div class="segment-panel" data-team-panel="canvas">
            <div class="editor-canvas-wrap">
              <div class="editor-toolbar"><strong data-i18n="layout_canvas"></strong><button id="resetPositionsBtn" class="secondary-btn small" type="button" data-i18n="reset_positions"></button></div>
              <div id="editorCanvas" class="editor-canvas"></div>
            </div>
          </div>

          <div class="section-header"><h3 data-i18n="data"></h3></div>
          <div class="actions vertical">
            <button id="saveBtn" class="primary-btn" type="button" data-i18n="save_team"></button>
            <button id="loadBtn" class="secondary-btn" type="button" data-i18n="load_team"></button>
            <button id="clearBtn" class="danger-btn" type="button" data-i18n="reset_team"></button>
          </div>
          <div id="statusBox" class="status-box info" data-i18n="ready"></div>
        </section>
      </section>
    </main>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
