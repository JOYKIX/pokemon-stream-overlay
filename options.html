<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Stream Overlay - Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page">
  <div class="app-shell app-shell-narrow">
    <header class="topbar">
      <div><p class="eyebrow">Sécurité</p><h1>Profil & accès</h1></div>
      <nav class="topbar-actions nav-tabs">
        <a class="ghost-btn" href="index.html"><span class="material-symbols-rounded">dashboard</span>Éditeur</a>
        <a class="ghost-btn" href="customize.html"><span class="material-symbols-rounded">palette</span>Design</a>
        <a class="ghost-btn active" href="options.html"><span class="material-symbols-rounded">settings</span>Profil</a>
        <button id="logoutBtn" class="ghost-btn" type="button"><span class="material-symbols-rounded">logout</span>Déconnexion</button>
      </nav>
    </header>

    <main class="single-column">
      <section class="panel">
        <div class="panel-head"><h2>Changer la clé d'édition</h2></div>
        <div class="field"><label for="currentChannel">Identifiant actuel</label><input id="currentChannel" type="text" readonly></div>
        <div class="field"><label for="currentKey">Clé actuelle</label><input id="currentKey" type="password"></div>
        <div class="field"><label for="nextKey">Nouvelle clé</label><input id="nextKey" type="password"></div>
        <button id="updateKeyBtn" class="primary-btn"><span class="material-symbols-rounded">key</span>Mettre à jour la clé</button>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Changer l'identifiant</h2><p>L'ancien identifiant sera supprimé.</p></div>
        <div class="field"><label for="nextChannel">Nouvel identifiant unique</label><input id="nextChannel" type="text" placeholder="nouvel-id"></div>
        <div class="field"><label for="renameKey">Clé d'édition</label><input id="renameKey" type="password"></div>
        <button id="renameBtn" class="danger-btn"><span class="material-symbols-rounded">drive_file_rename_outline</span>Renommer l'identifiant</button>
      </section>
      <div id="statusBox" class="status-box info">Prêt.</div>
    </main>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
