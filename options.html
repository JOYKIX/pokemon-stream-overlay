<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon Stream Overlay Studio - Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page">
  <div class="dashboard-shell">
    <aside class="sidebar">
      <div><p class="sidebar-kicker">Pokemon Stream Overlay</p><h1 class="sidebar-title">Profile</h1></div>
      <nav class="sidebar-nav">
        <p class="nav-group-label">GENERAL</p>
        <a class="nav-item" href="index.html"><span class="material-symbols-rounded">dashboard</span>Studio</a>
        <a class="nav-item" href="customize.html"><span class="material-symbols-rounded">palette</span>Design</a>
        <a class="nav-item" href="share.html"><span class="material-symbols-rounded">share</span>Partage</a>
        <p class="nav-group-label">ACCOUNT</p>
        <a class="nav-item active" href="options.html"><span class="material-symbols-rounded">person</span>Profile</a>
        <button id="logoutBtn" class="nav-item nav-btn" type="button"><span class="material-symbols-rounded">logout</span>Logout</button>
      </nav>
    </aside>
    <main class="dashboard-main">
      <header class="topbar"><h2 class="page-title">Profile</h2><div class="topbar-controls"><label class="switch-chip" for="languageSelect"><span>UI language</span><select id="languageSelect"><option value="en">English</option><option value="fr">Français</option></select></label></div></header>
      <section class="studio-grid design-grid">
        <section class="card">
          <div class="section-header"><h3>Account settings</h3></div>
          <div class="field"><label for="currentChannel">Username</label><input id="currentChannel" type="text" readonly></div>
          <div class="field"><label for="nextChannel">Email / new id</label><input id="nextChannel" type="text" placeholder="new-id"></div>
          <div class="field"><label for="renameKey">Edit key</label><input id="renameKey" type="password"></div>
          <button id="renameBtn" class="primary-btn" type="button">Update profile</button>

          <div class="section-header"><h3>Clé de récupération</h3></div>
          <div class="field"><label for="recoveryKeyDisplay">Recovery key</label><input id="recoveryKeyDisplay" type="password" readonly placeholder="Clique sur régénérer"></div>
          <div class="actions">
            <button id="toggleRecoveryBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">visibility</span>Afficher</button>
            <button id="regenerateRecoveryBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">autorenew</span>Régénérer</button>
            <button id="copyRecoveryBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">content_copy</span>Copier</button>
          </div>
        </section>

        <section class="card">
          <div class="section-header"><h3>Security</h3></div>
          <div class="field"><label for="currentKey">Current key</label><input id="currentKey" type="password"></div>
          <div class="field"><label for="nextKey">Change edit key</label><input id="nextKey" type="password"></div>
          <div class="actions">
            <button id="updateKeyBtn" class="primary-btn" type="button">Change edit key</button>
            <button id="regenerateKeyBtn" class="secondary-btn" type="button">Regenerate key</button>
            <button id="copyKeyBtn" class="secondary-btn" type="button">Copy key</button>
            <button id="toggleKeyBtn" class="secondary-btn" type="button">Show / hide key</button>
          </div>

          <div class="section-header"><h3>Danger zone</h3></div>
          <button id="deleteAccountBtn" class="danger-btn" type="button"><span class="material-symbols-rounded">delete</span>Supprimer le compte</button>

          <div id="statusBox" class="status-box info">Ready.</div>
        </section>
      </section>
    </main>
  </div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
