<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeOverlay Studio - Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page">
  <a class="site-header-anchor" href="index.html" aria-label="PokeOverlay home">PokeOverlay</a>

  <div class="dashboard-shell">
    <aside class="sidebar">
      <div><p class="sidebar-kicker" data-i18n="pokemon_stream_overlay_for_obs"></p><h1 class="sidebar-title" data-i18n="profile"></h1></div>
      <nav class="sidebar-nav">
        <p class="nav-group-label" data-i18n="general"></p>
        <a class="nav-item" href="index.html"><span class="material-symbols-rounded">dashboard</span><span data-i18n="studio"></span></a>
        <a class="nav-item" href="customize.html"><span class="material-symbols-rounded">palette</span><span data-i18n="design"></span></a>
        <a class="nav-item" href="share.html"><span class="material-symbols-rounded">share</span><span data-i18n="share"></span></a>
        <p class="nav-group-label" data-i18n="account"></p>
        <a class="nav-item active" href="options.html"><span class="material-symbols-rounded">person</span><span data-i18n="profile"></span></a>
        <button id="logoutBtn" class="nav-item nav-btn" type="button"><span class="material-symbols-rounded">logout</span><span data-i18n="logout"></span></button>
      </nav>
    </aside>
    <main class="dashboard-main">
      <header class="topbar"><h2 class="page-title" data-i18n="profile"></h2><div class="topbar-controls"><label class="switch-chip" for="languageSelect"><span data-i18n="ui_language"></span><select id="languageSelect"><option value="en" data-i18n="english"></option><option value="fr" data-i18n="french"></option><option value="es" data-i18n="spanish"></option><option value="ja" data-i18n="japanese"></option></select></label></div></header>
      <section class="studio-grid design-grid">
        <section class="card">
          <div class="section-header"><h3 data-i18n="account_settings"></h3></div>
          <div class="field"><label for="currentChannel" data-i18n="username"></label><input id="currentChannel" type="text" readonly></div>
          <div class="field"><label for="nextChannel" data-i18n="email_new_id"></label><input id="nextChannel" type="text" data-i18n-placeholder="new_id_placeholder" placeholder="new-id"></div>
          <div class="field"><label for="renameKey" data-i18n="edit_key"></label><input id="renameKey" type="password"></div>
          <button id="renameBtn" class="primary-btn" type="button" data-i18n="update_profile"></button>

          <div class="section-header"><h3 data-i18n="recovery_key_section"></h3></div>
          <div class="field"><label for="recoveryKeyDisplay" data-i18n="recovery_key"></label><input id="recoveryKeyDisplay" type="password" readonly data-i18n-placeholder="click_regenerate" placeholder="Clique sur régénérer"></div>
          <div class="actions">
            <button id="toggleRecoveryBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">visibility</span><span data-i18n="show"></span></button>
            <button id="regenerateRecoveryBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">autorenew</span><span data-i18n="regenerate"></span></button>
            <button id="copyRecoveryBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">content_copy</span><span data-i18n="copy"></span></button>
          </div>
        </section>

        <section class="card">
          <div class="section-header"><h3 data-i18n="security"></h3></div>
          <div class="field"><label for="currentKey" data-i18n="current_key"></label><input id="currentKey" type="password"></div>
          <div class="field"><label for="nextKey" data-i18n="change_edit_key"></label><input id="nextKey" type="password"></div>
          <div class="actions">
            <button id="updateKeyBtn" class="primary-btn" type="button" data-i18n="change_edit_key"></button>
            <button id="regenerateKeyBtn" class="secondary-btn" type="button" data-i18n="regenerate_key"></button>
            <button id="copyKeyBtn" class="secondary-btn" type="button" data-i18n="copy_key"></button>
            <button id="toggleKeyBtn" class="secondary-btn" type="button" data-i18n="show_hide_key"></button>
          </div>

          <div class="section-header"><h3 data-i18n="danger_zone"></h3></div>
          <button id="deleteAccountBtn" class="danger-btn" type="button"><span class="material-symbols-rounded">delete</span><span data-i18n="delete_account"></span></button>

          <div id="statusBox" class="status-box info" data-i18n="ready"></div>
        </section>
      </section>
    </main>
  </div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
