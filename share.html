<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeOverlay Studio - Partage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="app-page">
  <a class="site-header-anchor" href="index.html" aria-label="PokeOverlay home">PokeOverlay</a>

  <div class="dashboard-shell">
    <aside class="sidebar">
      <div><p class="sidebar-kicker" data-i18n="pokemon_stream_overlay_for_obs"></p><h1 class="sidebar-title" data-i18n="share"></h1></div>
      <nav class="sidebar-nav">
        <p class="nav-group-label" data-i18n="general"></p>
        <a class="nav-item" href="index.html"><span class="material-symbols-rounded">dashboard</span><span data-i18n="studio"></span></a>
        <a class="nav-item" href="customize.html"><span class="material-symbols-rounded">palette</span><span data-i18n="design"></span></a>
        <a class="nav-item active" href="share.html"><span class="material-symbols-rounded">share</span><span data-i18n="share"></span></a>
        <p class="nav-group-label" data-i18n="account"></p>
        <a class="nav-item" href="options.html"><span class="material-symbols-rounded">person</span><span data-i18n="profile"></span></a>
        <button id="logoutBtn" class="nav-item nav-btn" type="button"><span class="material-symbols-rounded">logout</span><span data-i18n="logout"></span></button>
      </nav>
    </aside>
    <main class="dashboard-main">
      <header class="topbar"><h2 class="page-title" data-i18n="data_sharing"></h2><div class="topbar-controls"><label class="switch-chip" for="languageSelect"><span data-i18n="ui_language"></span><select id="languageSelect"><option value="en" data-i18n="english"></option><option value="fr" data-i18n="french"></option><option value="es" data-i18n="spanish"></option><option value="ja" data-i18n="japanese"></option></select></label></div></header>
      <section class="studio-grid design-grid">
        <section class="card">
          <div class="section-header"><h3 data-i18n="generate_share_code"></h3></div>
          <div class="field"><label for="shareCodeOutput" data-i18n="current_code"></label><input id="shareCodeOutput" type="password" readonly data-i18n-placeholder="no_code_generated" placeholder="Aucun code généré"></div>
          <label class="checkbox-chip"><input id="autoRotateOnUse" type="checkbox"><span data-i18n="auto_regenerate_after_use"></span></label>
          <div class="actions">
            <button id="generateShareBtn" class="primary-btn" type="button"><span class="material-symbols-rounded">autorenew</span><span data-i18n="generate_24h"></span></button>
            <button id="toggleShareBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">visibility</span><span data-i18n="show_hide"></span></button>
            <button id="copyShareBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">content_copy</span><span data-i18n="copy"></span></button>
          </div>
          <p class="auth-note" data-i18n="code_encrypted_validity"></p>
        </section>

        <section class="card">
          <div class="section-header"><h3 data-i18n="import_data_from_other_account"></h3></div>
          <div class="field"><label for="sourceChannelInput" data-i18n="source_identifier"></label><input id="sourceChannelInput" type="text" data-i18n-placeholder="source_account_placeholder" placeholder="compte-source"></div>
          <div class="field"><label for="sourceShareCodeInput" data-i18n="share_code"></label><input id="sourceShareCodeInput" type="text" placeholder="xxxx-xxxx-xxxx-xxxx"></div>
          <div class="actions">
            <button id="importShareBtn" class="primary-btn" type="button"><span class="material-symbols-rounded">download</span><span data-i18n="import_team_design"></span></button>
          </div>
          <div id="statusBox" class="status-box info" data-i18n="ready"></div>
        </section>
      </section>
    </main>
  </div>
  <script type="module" src="assets/js/share.js"></script>
</body>
</html>
