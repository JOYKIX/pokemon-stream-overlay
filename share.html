<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon Stream Overlay Studio - Partage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page">
  <div class="dashboard-shell">
    <aside class="sidebar">
      <div><p class="sidebar-kicker">Pokemon Stream Overlay</p><h1 class="sidebar-title">Partage</h1></div>
      <nav class="sidebar-nav">
        <p class="nav-group-label">GENERAL</p>
        <a class="nav-item" href="index.html"><span class="material-symbols-rounded">dashboard</span>Studio</a>
        <a class="nav-item" href="customize.html"><span class="material-symbols-rounded">palette</span>Design</a>
        <a class="nav-item active" href="share.html"><span class="material-symbols-rounded">share</span>Partage</a>
        <p class="nav-group-label">ACCOUNT</p>
        <a class="nav-item" href="options.html"><span class="material-symbols-rounded">person</span>Profile</a>
        <button id="logoutBtn" class="nav-item nav-btn" type="button"><span class="material-symbols-rounded">logout</span>Logout</button>
      </nav>
    </aside>
    <main class="dashboard-main">
      <header class="topbar"><h2 class="page-title">Partage des données</h2></header>
      <section class="studio-grid design-grid">
        <section class="card">
          <div class="section-header"><h3>Générer un code de partage</h3></div>
          <div class="field"><label for="shareCodeOutput">Code actuel</label><input id="shareCodeOutput" type="password" readonly placeholder="Aucun code généré"></div>
          <label class="checkbox-chip"><input id="autoRotateOnUse" type="checkbox"><span>Régénérer automatiquement après utilisation</span></label>
          <div class="actions">
            <button id="generateShareBtn" class="primary-btn" type="button"><span class="material-symbols-rounded">autorenew</span>Générer (24h)</button>
            <button id="toggleShareBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">visibility</span>Afficher / masquer</button>
            <button id="copyShareBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">content_copy</span>Copier</button>
          </div>
          <p class="auth-note">Le code est chiffré en base. Validité: 24h.</p>
        </section>

        <section class="card">
          <div class="section-header"><h3>Importer les données d'un autre compte</h3></div>
          <div class="field"><label for="sourceChannelInput">Identifiant source</label><input id="sourceChannelInput" type="text" placeholder="compte-source"></div>
          <div class="field"><label for="sourceShareCodeInput">Code de partage</label><input id="sourceShareCodeInput" type="text" placeholder="xxxx-xxxx-xxxx-xxxx"></div>
          <div class="actions">
            <button id="importShareBtn" class="primary-btn" type="button"><span class="material-symbols-rounded">download</span>Importer team + design</button>
          </div>
          <div id="statusBox" class="status-box info">Prêt.</div>
        </section>
      </section>
    </main>
  </div>
  <script type="module" src="share.js"></script>
</body>
</html>
