<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Stream Overlay - Connexion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page login-page">
  <main class="auth-card panel">
    <p class="eyebrow">Sécurisation de l’éditeur</p>
    <h1>Connexion par identifiant + clé d’édition</h1>
    <p class="auth-note">Ce n’est pas un système de compte complet : la clé sert uniquement à verrouiller ton identifiant pour empêcher les modifications par d’autres personnes.</p>

    <div class="field">
      <label for="channelInput">Identifiant unique</label>
      <input id="channelInput" type="text" placeholder="ex: joykix" />
    </div>

    <div class="field">
      <label for="editKeyInput">Clé d’édition</label>
      <input id="editKeyInput" type="password" placeholder="Ta clé privée" />
    </div>

    <label class="checkbox-chip wide"><input type="checkbox" id="createMode"><span>Créer un nouvel identifiant (sinon connexion)</span></label>

    <div class="actions vertical">
      <button id="submitBtn" class="primary-btn">Continuer</button>
    </div>

    <div id="statusBox" class="status-box info">Prêt.</div>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
