<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokeOverlay Studio V2 - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page login-page">
  <a class="site-header-anchor" href="index.html" aria-label="PokeOverlay home">PokeOverlay</a>

  <main class="auth-card panel">
    <p class="eyebrow" data-i18n="secure_login"></p>
    <h1 data-i18n="identifier_edit_key"></h1>
    <p class="auth-note" data-i18n="simple_fast_private"></p>
    <div class="field"><label for="languageSelect" data-i18n="ui_language"></label><select id="languageSelect"><option value="en" data-i18n="english"></option><option value="fr" data-i18n="french"></option><option value="es" data-i18n="spanish"></option><option value="ja" data-i18n="japanese"></option></select></div>

    <div class="field"><label for="channelInput" data-i18n="unique_identifier"></label><input id="channelInput" type="text" data-i18n-placeholder="example_joykix" placeholder="e.g. joykix" /></div>
    <div class="field"><label for="editKeyInput" data-i18n="edit_key"></label><input id="editKeyInput" type="password" data-i18n-placeholder="private_key_placeholder" placeholder="Your private key" /></div>
    <label class="checkbox-chip wide"><input type="checkbox" id="createMode"><span data-i18n="create_new_identifier"></span></label>
    <button id="submitBtn" class="primary-btn"><span class="material-symbols-rounded">login</span><span data-i18n="continue"></span></button>

    <section class="card">
      <div class="section-header"><h3 data-i18n="forgot_password"></h3></div>
      <div class="field"><label for="recoveryChannelInput" data-i18n="identifier"></label><input id="recoveryChannelInput" type="text" data-i18n-placeholder="example_joykix" placeholder="e.g. joykix"></div>
      <div class="field"><label for="recoveryKeyInput" data-i18n="recovery_key"></label><input id="recoveryKeyInput" type="text" placeholder="xxxx-xxxx-xxxx-xxxx"></div>
      <div class="field"><label for="newPasswordInput" data-i18n="new_edit_key"></label><input id="newPasswordInput" type="password" data-i18n-placeholder="new_key_placeholder" placeholder="New key"></div>
      <button id="recoverBtn" class="secondary-btn" type="button"><span class="material-symbols-rounded">key</span><span data-i18n="reset_key"></span></button>
    </section>

    <div id="recoveryKeyBox" class="status-box info" style="display:none"></div>
    <div id="statusBox" class="status-box info" data-i18n="ready"></div>
  </main>
  <script type="module" src="dist/login.js"></script>
</body>
</html>
